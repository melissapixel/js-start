<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 25</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- На странице есть кнопка. При клике на неё через 2 секунды в консоли появляется сообщение «Прошло 2 секунды». Больше ничего не происходит. -->
  <div class="content">
    <div class="container task1">
      <button>Click me</button>
      <p></p>
    </div>

    <!-- На странице есть кнопка с текстом «Нажми меня». При клике на неё текст кнопки меняется на «Подожди...», а через 3 секунды текст снова становится «Нажми меня». -->
    <div class="container task2">
      <button>Click me</button>
    </div>

    <!-- На странице есть число «0». Как только страница загрузилась, число начинает расти: 1, 2, 3, 4... и так каждую секунду. Бесконечно. -->
     <div class="container task3">
        <p class="count"></p>
     </div>

     <!-- На странице есть число «0» и кнопка «Стоп». Число растёт каждую секунду (как в задании 3). При клике на кнопку «Стоп» число перестаёт расти. -->
      <div class="container task4">
        <p class="num"></p>
        <button>Stop</button>
      </div>

      <!-- На странице есть число «10». Как только страница загрузилась, число начинает уменьшаться: 9, 8, 7... до нуля. Когда доходит до нуля — останавливается само. -->
       <div class="container task5">
          <p class="count1"></p>
       </div>

       <!-- На странице есть кнопка и пустой блок. При клике на кнопку в блоке появляется текст «Сохранено!». Через 3 секунды этот текст исчезает сам. -->
        <div class="container task6">
          <button>Click me</button>
          <p></p>
        </div>

      <!-- На странице есть квадратик. Как только страница загрузилась, он начинает мигать: становится красным, потом снова обычным, потом снова красным — и так каждую секунду. Бесконечно. -->
       <div class="container box"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
