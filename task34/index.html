<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Task 34</title>
</head>
<body>
  <div class="container">
    <div class="content shop">
      <h2 class="title">SHOP</h2>
      <ul class="shop__list">
        <li draggable="true">Backpack or book bag</li>
        <li draggable="true">Lunchbox and insulated water bottle</li>
        <li draggable="true">Pencil case or box</li>
        <li draggable="true">Pencils and pens (blue, black, or red)</li>
        <li draggable="true">Colored pencils, crayons, or markers</li>
      </ul>
    </div> 

    <div class="content cart">
      <h2 class="title">CART</h2>
      <ul class="cart__list">
        <li draggable="true">Craft items: Scissors and glue</li>
        <li draggable="true">Geometry tools: Rulers and compasses</li>
      </ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
